<svg xmlns="http://www.w3.org/2000/svg" width="850" height="346" viewBox="0 0 850 346" role="img">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
      .pkt { stroke-linecap: round; fill: none; }
      .flow-f1 { stroke-dasharray: 24 216; animation: flowFwd 3.2s linear infinite; }
      .flow-f2 { stroke-dasharray: 20 220; animation: flowFwd 3.8s linear -1.2s infinite; }
      .flow-f3 { stroke-dasharray: 18 222; animation: flowFwd 2.8s linear -0.7s infinite; }
      .flow-r1 { stroke-dasharray: 22 218; animation: flowRev 3.6s linear -0.5s infinite; }
      .flow-ring1 { stroke-dasharray: 34 386; animation: flowRing 4.2s linear infinite; }
      .flow-ring2 { stroke-dasharray: 34 386; animation: flowRing 4.2s linear -2.1s infinite; }
      .pulse { animation: pulseDot 2.4s ease-in-out infinite; }
      @keyframes flowFwd { from { stroke-dashoffset: 240; } to { stroke-dashoffset: 0; } }
      @keyframes flowRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 240; } }
      @keyframes flowRing { from { stroke-dashoffset: 420; } to { stroke-dashoffset: 0; } }
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      

      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
